[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"

[server]
headless = true
runOnSave = false

[client]
# 오류를 숨기지 않는다 (내부용 대시보드 — 로그를 못 보는 팀원도 원인을 볼 수 있게)
showErrorDetails = "full"

[browser]
gatherUsageStats = false
